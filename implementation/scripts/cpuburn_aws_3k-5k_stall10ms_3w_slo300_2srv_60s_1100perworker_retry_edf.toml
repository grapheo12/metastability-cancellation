# cpuburn_aws_3k-5k_stall10ms_3w_slo300_2srv_60s_1100perworker_retry.toml with the edf QueueDiscipline.
# (3 workers: 3300 req/s per server on paper; the 4-core server machine caps it lower).
[repo]
url = "https://github.com/grapheo12/metastability-cancellation.git"

[machines.server]
host = "metafail-exp-1"
data_addr = "172.31.23.63"

[machines.client]
host = "metafail-exp-2"

[server]
listen_port = 8080
instances = 2
workload = "cpu_burn"
response_rate = 1100   # per worker
initial_stall_ms = 10
n_worker_threads = 3
queue_discipline = "edf"
response_bytes = 128

[load_gen]
num_clients = 16
global_rate = [3000, 3200, 3400, 3600, 3800, 4000, 4200, 4400, 4600, 4800, 5000]
request_bytes = 128
slo_ms = 300
duration_s = 60
retry_timeout_ms = 150
max_retries = 1

[ingress]
machine = "server"   # Ingress next to the server on metafail-exp-1
listen_port = 9090
lb_policy = "ewma"   # ewma_beta defaults to 0.7; cancel_rate defaults to 0 (no cancellations)

[run]
sweep_order = ["load_gen.global_rate"]
cooldown_s = 2
