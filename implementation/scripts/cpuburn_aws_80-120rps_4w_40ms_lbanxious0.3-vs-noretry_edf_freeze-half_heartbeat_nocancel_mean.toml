# CPU-burn, 40 ms mean service time (half of the 80 ms runs), deadline_mean only: one of two servers freezes at 60 s (WorkerFreeze,
# FreezeTarget), heartbeats drop it from the Ingress (BackendLiveness), no SLO cancellation (slo_cancel = false,
# DrainDeadline 60 s), EDF. The DeadlineFilter waits in the FilterWaitQueue (re-checked every 10 ms, dropped past the
# SLO).
# Servers have 4 cores: 4 workers burning CPU for an exponential 40 ms mean (response_rate = 25 per worker), so
# 100 req/s per server: 200 before the freeze, 100 after. 80 req/s is 40% / 80% of capacity before / after the
# freeze, 120 req/s is 60% / 120% (the same ratios as 40 and 60 req/s with 80 ms).
# Retries: the client sends one copy (max_retries = 0). The Ingress either retries once (lb_max_retries = 1) with the
# anxious RetryPolicy at lb_retry_anxiety_ratio = 0.3 (retry_policy v0.6.0: ExpectedLate, EdfAhead), or never retries
# (lb_retry_policy = none): no retries anywhere. Servers use EDF queues (queue_discipline = edf), which EdfAhead assumes.
# Same as ..._40ms_lbanxious0.5-vs-noretry_fifo_... except the ratio and the queue discipline.
# Sweep: lb_retry_policy (anxious, none) x global_rate (80, 120 req/s): 4 points, about 3 min each.
#
# Meant to be run ON metafail-exp-1 (client = "local"), detached:
#   python3 implementation/scripts/bench.py run implementation/scripts/cpuburn_aws_80-120rps_4w_40ms_lbanxious0.3-vs-noretry_edf_freeze-half_heartbeat_nocancel_mean.toml
# exp-1 reaches the servers over their private addresses with its own key ~/.ssh/id_ed25519_bench.
[repo]
url = "https://github.com/grapheo12/metastability-cancellation.git"

[[machines.server]]
host = "172.31.30.174"   # metafail-exp-2
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519_bench"
data_addr = "172.31.30.174"

[[machines.server]]
host = "172.31.21.15"    # metafail-exp-3
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519_bench"
data_addr = "172.31.21.15"

[machines.client]
host = "local"           # metafail-exp-1, where this runner runs

[server]
listen_port = 8080
instances = 1   # per server machine: 2 servers in total
workload = "cpu_burn"
response_rate = 25   # per worker: 40 ms mean (100 req/s per 4-worker server)
initial_stall_ms = 0
n_worker_threads = 4   # one per core (4-core servers)
queue_discipline = "edf"
response_bytes = 128
freeze_after_ms = 60000   # half of load_gen.duration_s
freeze_instance = 0       # FreezeTarget: only the metafail-exp-2 server freezes
heartbeat_interval_ms = 500  # Heartbeat: one HeartbeatLine every 500 ms

[load_gen]
num_clients = 16
global_rate = [80, 120]   # 40% / 60% of 2 x 100 req/s before the freeze, 80% / 120% of 100 after
request_bytes = 128
slo_ms = 5000
duration_s = 120
n_waiting_requests = 500
retry_timeout_ms = 2000
max_retries = 0   # client retries off: the Ingress retries instead
slo_cancel = false        # late requests run to completion (DrainDeadline instead of SLOCancellation)
drain_timeout_ms = 60000  # DrainDeadline: 60 s after duration_s; lets the overloaded survivor's backlog drain

[ingress]
machine = "client"   # Ingress next to the load generator on metafail-exp-1
listen_port = 9090
lb_policy = "ewma"
heartbeat_timeout_ms = 1000  # BackendLiveness: no new requests after 2 missed heartbeats
lb_retry_policy = ["anxious", "none"]   # AnxiousRetry, or no LbRetries (none never retries)
lb_max_retries = 1
lb_retry_anxiety_ratio = 0.3
lb_filter = "deadline_mean"  # DeadlineStrategy

[run]
sweep_order = ["ingress.lb_retry_policy", "load_gen.global_rate"]
cooldown_s = 2
