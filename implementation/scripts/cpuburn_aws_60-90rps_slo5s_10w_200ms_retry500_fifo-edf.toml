# Large standing queue: 60-90 req/s offered (rerun of cpuburn_aws_100rps_..., below 100% load), Exponential service time with 200 ms mean
# (cpu_burn, response_rate = 5 per worker), 10 workers per server, 2 servers, SLO 5 s,
# no initial stall, retry timeout 500 ms. Sweep [no retries, 1 retry] x [fifo, edf].
[repo]
url = "https://github.com/grapheo12/metastability-cancellation.git"

[machines.server]
host = "metafail-exp-1"
data_addr = "172.31.23.63"

[machines.client]
host = "metafail-exp-2"

[server]
listen_port = 8080
instances = 2
workload = "cpu_burn"
response_rate = 5   # per worker: 200 ms mean
initial_stall_ms = 0
n_worker_threads = 10
queue_discipline = ["fifo", "edf"]
response_bytes = 128

[load_gen]
num_clients = 16
global_rate = [60, 70, 80, 90]
request_bytes = 128
slo_ms = 5000
duration_s = 120
n_waiting_requests = 500
retry_timeout_ms = 500
max_retries = [0, 1]

[ingress]
machine = "server"   # Ingress next to the server on metafail-exp-1
listen_port = 9090
lb_policy = "ewma"

[run]
sweep_order = ["load_gen.global_rate", "load_gen.max_retries", "server.queue_discipline"]
cooldown_s = 2
