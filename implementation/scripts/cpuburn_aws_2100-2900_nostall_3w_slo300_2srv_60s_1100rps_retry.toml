# cpuburn_aws_2100-2900_stall1s_3w_slo300_2srv_60s_1100rps_retry.toml without the initial stall
# (server.initial_stall_ms = 0, copied to the load generator, so no StallWindow either).
[repo]
url = "https://github.com/grapheo12/metastability-cancellation.git"

[machines.server]
host = "metafail-exp-1"
data_addr = "172.31.23.63"

[machines.client]
host = "metafail-exp-2"

[server]
listen_port = 8080
instances = 2
workload = "cpu_burn"
response_rate = 366.6666666666667   # per worker: 3 workers x 366.67 = 1100 req/s per server
initial_stall_ms = 0
n_worker_threads = 3
response_bytes = 128

[load_gen]
num_clients = 16
global_rate = [2100, 2200, 2300, 2400, 2500, 2600, 2700, 2800, 2900]
request_bytes = 128
slo_ms = 300
duration_s = 60
retry_timeout_ms = 150
max_retries = 1

[ingress]
machine = "server"   # Ingress next to the server on metafail-exp-1
listen_port = 9090
lb_policy = "ewma"   # ewma_beta defaults to 0.7; cancel_rate defaults to 0 (no cancellations)

[run]
sweep_order = ["load_gen.global_rate"]
cooldown_s = 2
