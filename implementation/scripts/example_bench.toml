# BenchmarkRunner example config. Schema: abstraction/benchmark_runner/config/api.md
# Any program parameter given as an array is swept; the run covers the cross product.

[repo]
# Defaults to this checkout's origin remote. Both machines clone from it, so they need read access:
# a GitHub SSH key on each machine for this URL, or the https:// URL if the repository is public.
url = "git@github.com:grapheo12/metastability-cancellation.git"

[machines.server]
host = "10.0.0.5"            # or "local"
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519"
workdir = "~/cancellation-bench"
data_addr = "10.0.0.5"       # address the client machine uses to reach the server

[machines.client]
host = "10.0.0.6"
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519"

[server]
listen_port = 8080          # server instance k listens on listen_port + k
instances = 2               # two servers behind the Ingress
response_rate = [2000, 4000]
response_bytes = 128
cancel_mode = "cooperative"

[load_gen]
num_clients = [8, 32]
global_rate = [1000, 2000, 3000]
request_bytes = 128
slo_ms = 5
duration_s = 10

[ingress]                   # runs on the client machine; the load generator talks to it
listen_port = 9090
lb_policy = "least_outstanding"
cancel_rate = 2000          # the in-Ingress LoadCanceller (0 or unset: no cancels)

[run]
sweep_order = ["load_gen.global_rate", "server.response_rate", "load_gen.num_clients"]
cooldown_s = 2
