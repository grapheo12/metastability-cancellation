# BbrFilter without LB retries: Linux BBR v1 per backend (one attempt per packet) at 120 req/s, SLO 4 s; init_cwnd 10
# (abstraction/ingress/load_balancer/design.md#bbrfilter). Each backend's cwnd and pacing come from its measured
# delivery rate (BtlBw) and minimum RTT (RTprop); a hedged-away attempt is a HedgeCancel, not a loss.
# Envoy-only values (impl/go rejects them): lb_policy peak_ewma, lb_filter bbr, forward_mode hedge,
# arrival_rng native.
# impl/envoy: 2 Go servers, Envoy as the Ingress, Nighthawk as the load generator, no LB retries (one attempt per
# request).
# 120 s run; one of the two servers stalls at 60 s (WorkerFreeze, FreezeTarget = instance 0 on metafail-exp-2).
# Servers: 40 workers sleeping a constant 400 ms, 100 req/s each.
# Load: RateSchedule 200 req/s for the first 30 s, then 120 req/s (Poisson, 16 clients), SLO 4 s (10 x the mean service time), 120 s, DrainDeadline 30 s.
#
# Meant to be run ON metafail-exp-1 (client = "local"), detached, from a checkout of impl/envoy:
#   python3 implementation/scripts/bench.py run implementation/envoy/experiments/sleep-constant_aws_200to120rps_120s_slo4s_40w_400ms_noretry_peakewma-bbr_freeze-half.toml
[repo]
url = "https://github.com/grapheo12/metastability-cancellation.git"

[[machines.server]]
host = "172.31.30.174"   # metafail-exp-2
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519_bench"
data_addr = "172.31.30.174"

[[machines.server]]
host = "172.31.21.15"    # metafail-exp-3
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519_bench"
data_addr = "172.31.21.15"

[machines.client]
host = "local"           # metafail-exp-1, where this runner runs

[server]
listen_port = 8080
instances = 1   # per server machine: 2 servers in total
workload = "sleep_constant"   # ConstantServiceTime: every request sleeps exactly 400 ms
response_rate = 2.5   # per worker: 400 ms each (100 req/s per 40-worker server)
initial_stall_ms = 0
n_worker_threads = 40
queue_discipline = "edf"
response_bytes = 128
freeze_after_ms = 60000   # half of load_gen.duration_s
freeze_instance = 0       # FreezeTarget: only the metafail-exp-2 server stalls

[load_gen]
arrival_rng = "native"   # Nighthawk's own generator per worker, seeded seed + k
num_clients = 16
global_rate = 120   # nominal rate (the RateSchedule below drives arrivals)
rate_schedule = "0:200,30:120"   # RateSchedule: 200 req/s (100% of 2 x 100) for 30 s, then 120
request_bytes = 128
slo_ms = 4000   # 10 x the 400 ms mean service time
duration_s = 120
n_waiting_requests = 500
max_retries = 0           # no client retries
initial_stall_ms = 0      # no StallWindow
slo_cancel = false        # late requests run to completion; DrainDeadline ends the rest
drain_timeout_ms = 30000  # DrainDeadline: 30 s after duration_s

[ingress]
forward_mode = "hedge"   # HedgedForwarding: the only forwarding Envoy realizes
machine = "client"   # Ingress next to the load generator on metafail-exp-1
listen_port = 9090
lb_policy = "peak_ewma"   # Envoy's contrib Peak EWMA (PeakEwmaRtt, PeakEwmaCost)
heartbeat_timeout_ms = 0     # no Heartbeat Monitor
lb_retry_policy = "none"  # no LB retries
lb_max_retries = 0
lb_filter = "bbr"  # BbrFilter
lb_bbr_init_cwnd = 10  # Linux TCP_INIT_CWND

[run]
sweep_order = []
cooldown_s = 2
