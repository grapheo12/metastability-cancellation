# No longer runnable on impl/envoy: lb_policy round_robin is not supported by this implementation (Envoy's round
# robin is per worker, not the spec's). Kept as the record of the first Envoy/Go comparison.
# impl/envoy first experiment: 2 Go servers, Envoy as the Ingress (round robin), Nighthawk as the load generator,
# no retries, no freeze (heartbeats are not implemented on impl/envoy yet).
# Servers: 40 workers sleeping an exponential 400 ms mean (response_rate = 2.5 per worker), 100 req/s each.
# Load: 80 req/s Poisson from 16 clients (40% of 2 x 100 req/s), SLO 17 s, 60 s, DrainDeadline 30 s.
# The same file runs the Go stack for comparison: run it from an impl/go checkout (the runner deploys whatever
# impl/<lang> branch the checkout it runs from is on).
#
# Meant to be run ON metafail-exp-1 (client = "local"), detached, from a checkout of impl/envoy:
#   python3 implementation/scripts/bench.py run implementation/envoy/experiments/sleep_aws_80rps_60s_slo17s_40w_400ms_noretry_rr.toml
[repo]
url = "https://github.com/grapheo12/metastability-cancellation.git"

[[machines.server]]
host = "172.31.30.174"   # metafail-exp-2
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519_bench"
data_addr = "172.31.30.174"

[[machines.server]]
host = "172.31.21.15"    # metafail-exp-3
user = "ubuntu"
ssh_key = "~/.ssh/id_ed25519_bench"
data_addr = "172.31.21.15"

[machines.client]
host = "local"           # metafail-exp-1, where this runner runs

[server]
listen_port = 8080
instances = 1   # per server machine: 2 servers in total
workload = "sleep"
response_rate = 2.5   # per worker: 400 ms mean (100 req/s per 40-worker server)
initial_stall_ms = 0
n_worker_threads = 40
queue_discipline = "edf"
response_bytes = 128

[load_gen]
num_clients = 16
global_rate = [80]   # 40% of 2 x 100 req/s
request_bytes = 128
slo_ms = 17000
duration_s = 60
n_waiting_requests = 500
max_retries = 0           # no client retries
initial_stall_ms = 0      # no StallWindow
slo_cancel = false        # late requests run to completion; DrainDeadline ends the rest
drain_timeout_ms = 30000  # DrainDeadline: 30 s after duration_s

[ingress]
machine = "client"   # Ingress next to the load generator on metafail-exp-1
listen_port = 9090
lb_policy = "round_robin"
heartbeat_timeout_ms = 0     # no Heartbeat Monitor
lb_retry_policy = "none"     # no LbRetries
lb_max_retries = 0
lb_filter = "none"           # no DeadlineFilter

[run]
sweep_order = ["load_gen.global_rate"]
cooldown_s = 2
