syntax = "proto3";

package envoy.extensions.load_balancing_policies.peak_ewma_deadline.v3alpha;

import "contrib/envoy/extensions/load_balancing_policies/peak_ewma/v3alpha/peak_ewma.proto";

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";

import "xds/annotations/v3/status.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.load_balancing_policies.peak_ewma_deadline.v3alpha";
option java_outer_classname = "PeakEwmaDeadlineProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/contrib/envoy/extensions/load_balancing_policies/peak_ewma_deadline/v3alpha";
option (udpa.annotations.file_status).package_version_status = ACTIVE;
option (xds.annotations.v3.file_status).work_in_progress = true;

// [#protodoc-title: Peak EWMA with a deadline filter]
// impl/envoy (cancellation testbed): a deadline filter over EVERY healthy host on Peak EWMA's RTT EWMA, with a
// FIFO wait queue (the testbed's DeadlineFilter and FilterWaitQueue, abstraction/ingress/load_balancer/design.md).
//
// A request carrying the deadline header (decimal Unix ns) is never sent to a host whose ProvisionalCurrentRTT, times
// filter_margin, exceeds its remaining time (`filter_margin * provisional_ms * 1e6 > deadline - now`); a host without
// an RTT sample and with nothing pending always fits.
// Among the hosts that fit it takes the lowest Peak EWMA cost, `RTT_ewma * (active_requests + 1)` (ties at
// random). When none fits, or requests are already waiting, it waits in this
// worker's FIFO queue, re-checked every `queue_tick`, oldest first; once its deadline has passed it fails with
// "no healthy upstream" (503). Requests without the header are not filtered and never wait.
//
// [#extension: envoy.load_balancing_policies.peak_ewma_deadline]
message PeakEwmaDeadline {
  option (xds.annotations.v3.message_status).work_in_progress = true;

  // Peak EWMA settings (decay time, aggregation interval, default RTT, penalty), as for the Peak EWMA policy.
  peak_ewma.v3alpha.PeakEwma peak_ewma = 1;

  // How often a worker re-checks its waiting requests. Defaults to 10 ms.
  google.protobuf.Duration queue_tick = 2;

  // The request header carrying the deadline as decimal Unix ns. Defaults to `x-request-deadline`.
  string deadline_header = 3;

  // FilterMargin gamma (>= 1): a host is refused when gamma x its ProvisionalCurrentRTT exceeds the time left.
  // 0 (unset) or anything below 1 means 1.
  double filter_margin = 4;

  // FilterProbe tau: a host the filter refuses still gets the request with probability 1 - e^(-dt/tau), dt the time
  // since it was last handed a request. Unset or 0: off.
  google.protobuf.Duration probe_tau = 5;

  // TokenBucketFilter (abstraction/ingress/load_balancer/design.md#tokenbucketfilter). When set, the deadline test
  // above (filter_margin, probe_tau) is replaced: a host is kept for a request with a deadline only if its token
  // bucket holds a whole token, the chosen host gives one up, and the bucket's refill rate adapts by AIMD from the
  // latencies the testbed_token_bucket upstream filter reports. Waiting is as above.
  TokenBucket token_bucket = 6;
}

// The TokenBucketFilter's parameters (the Ingress's lb_tb_*). Unset fields take the defaults given.
message TokenBucket {
  option (xds.annotations.v3.message_status).work_in_progress = true;

  // The SLO an answered attempt's latency is judged against (lb_tb_slo_ms). Required (> 0).
  google.protobuf.Duration slo = 1;

  // init_r, tokens/s per host (lb_tb_init_rate). Default 50.
  google.protobuf.DoubleValue init_rate = 2;

  // Bucket capacity (lb_tb_max_tokens). Default 10.
  google.protobuf.DoubleValue max_tokens = 3;

  // A slow answer divides the rate by this, at most once per slo (lb_tb_mult_dec). Default 2.
  google.protobuf.DoubleValue mult_dec = 4;

  // An answer faster than slo / add_inc_limit raises the rate (lb_tb_add_inc_limit). Default 2.
  google.protobuf.DoubleValue add_inc_limit = 5;

  // The rate rises by add_inc_frac * init_rate per fast answer (lb_tb_add_inc_frac). Default 0.1.
  google.protobuf.DoubleValue add_inc_frac = 6;

  // The rate never falls below min_rate_frac * init_rate (lb_tb_min_rate_frac). Default 0.1.
  google.protobuf.DoubleValue min_rate_frac = 7;
}
